[package]
name = "cobra-desktop"
version = "0.4.2"
description = "Cobra's desk: the desktop app for the local agent, on Linux and macOS"
authors = ["Cobra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "cobra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time", "fs", "process", "sync", "macros", "rt", "net"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
gethostname = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
